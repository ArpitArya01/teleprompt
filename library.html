<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Library — Teleprompt</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body class="app-body page">

<div class="topbar">
  <div class="topbar-logo">
    <div class="logo-icon">
      <svg width="15" height="15" viewBox="0 0 14 14" fill="white" aria-hidden="true"><path d="M2 1.5l10 5.5-10 5.5V1.5z"/></svg>
    </div>
    TELE<span class="logo-accent">PROMPT</span>
  </div>

  <div class="topbar-actions">
    <nav class="nav-links" aria-label="Main">
      <a class="nav-link" href="index.html">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        Teleprompter
      </a>
      <a class="nav-link active" href="library.html" aria-current="page">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5a1 1 0 0 1 1-1h3l1.5 1.5h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1z"/></svg>
        Library
      </a>
      <a class="nav-link" href="report.html">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13.5V9m4 4.5v-8m4 8V7m4 6.5V3.5"/></svg>
        Report
      </a>
    </nav>
    <span class="topbar-badge" id="libraryCount">Library</span>
    <div class="avatar-chip" title="Local workspace — everything is saved in this browser">
      <span class="avatar">AA</span>
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 4l3 3 3-3"/></svg>
    </div>
  </div>
</div>

<div class="app">

  <main class="page-wrap">

    <div class="page-head">
      <div class="page-head-text">
        <span class="card-icon pink page-head-icon">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5a1 1 0 0 1 1-1h3l1.5 1.5h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1z"/></svg>
        </span>
        <div>
          <h1 class="page-title">Script <span class="accent">Library</span></h1>
          <p class="page-sub" id="pageSub">Every script you save lives here.</p>
        </div>
      </div>
      <div class="page-head-actions">
        <button class="btn primary" id="newBtn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
          New script
        </button>
        <button class="btn" id="importBtn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5V2.5M4.5 7L8 10.5 11.5 7M2.5 13.5h11"/></svg>
          Import .txt
        </button>
        <button class="btn" id="exportBtn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.5 6L8 2.5 11.5 6M2.5 13.5h11"/></svg>
          Export backup
        </button>
        <input type="file" id="importFile" accept=".txt,text/plain" multiple hidden>
      </div>
    </div>

    <div class="search-row">
      <div class="search-field">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg>
        <input type="search" class="search-input" id="searchInput"
               placeholder="Search by name or content…" aria-label="Search scripts">
      </div>
      <button class="btn" id="sortBtn" title="Change sort order">Sort: Recent</button>
    </div>

    <div id="cards" class="card-grid" aria-live="polite"></div>

    <div id="emptyState" class="empty" hidden>
      <div class="empty-icon">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 8a1.5 1.5 0 0 1 1.5-1.5h5l2.5 2.5h11A1.5 1.5 0 0 1 25 10.5v11A1.5 1.5 0 0 1 23.5 23h-19A1.5 1.5 0 0 1 3 21.5z"/>
          <path d="M14 13.5v5M11.5 16h5"/>
        </svg>
      </div>
      <div class="big">No scripts yet</div>
      <p>Create one with <strong>New script</strong>, or import a <code>.txt</code> file.<br>
         Whatever you were writing on the teleprompter page gets pulled in here automatically.</p>
    </div>

  </main>
</div>

<!-- Rename / create dialog -->
<div class="modal-backdrop" id="nameModal" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
  <div class="modal">
    <h3 id="nameModalTitle">Name this script</h3>
    <label for="nameInput">Script name</label>
    <input type="text" id="nameInput" maxlength="80" placeholder="e.g. Opening speech">
    <div class="modal-actions">
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="nameSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Delete confirmation -->
<div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="modal">
    <h3 id="confirmTitle">Delete this script?</h3>
    <p class="modal-msg" id="confirmMsg"></p>
    <div class="modal-actions">
      <button class="btn" data-close>Keep it</button>
      <button class="btn danger" id="confirmYesBtn">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/script-model.js"></script>
<script src="js/storage.js"></script>
<script src="js/library.js"></script>
</body>
</html>
